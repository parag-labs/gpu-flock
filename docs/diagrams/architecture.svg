<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="940" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">gpu-flock - boids, computed and rendered on the GPU</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">The entire per-frame workload lives on the GPU: two ping-pong buffers, a compute pass, and a render pass - the CPU never touches a boid.</text><rect x="50" y="172" width="250" height="326" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">CPU · MAIN.JS</text><rect x="70" y="232" width="210" height="104" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,247) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="116" y="263" font-size="16.5" font-weight="700" fill="#3d4a63">rAF loop</text><text x="87" y="285.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">uploadParams()</text><text x="87" y="302.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">encode + submit</text><text x="87" y="320.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">swap ping-pong</text><rect x="70" y="388" width="210" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,403) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="116" y="419" font-size="16.5" font-weight="700" fill="#186547">CPU cost O(1)</text><text x="87" y="441.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">flat in boid count</text><text x="87" y="458.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">GPU owns the flock</text><rect x="336" y="172" width="1184" height="326" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#2aa5b0" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="354" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#136b74">GPU · THE WHOLE PER-FRAME LOOP</text><rect x="360" y="250" width="257" height="136" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(476.5,264) scale(1.0000)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="488.5" y="308" text-anchor="middle" font-size="16.5" font-weight="700" fill="#136b74">Buffer A</text><text x="488.5" y="329.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Boid: pos + vel</text><text x="488.5" y="346.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">16-byte stride</text><text x="488.5" y="364.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">storage · read</text><rect x="657" y="250" width="257" height="136" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(773.5,264) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="785.5" y="308" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">Compute pass</text><text x="785.5" y="329.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">@workgroup_size(64)</text><text x="785.5" y="346.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one thread per boid</text><text x="785.5" y="364.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">reads the whole flock</text><rect x="954" y="250" width="257" height="136" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1070.5,264) scale(1.0000)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="1082.5" y="308" text-anchor="middle" font-size="16.5" font-weight="700" fill="#136b74">Buffer B</text><text x="1082.5" y="329.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">compute writes here</text><text x="1082.5" y="346.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">storage · read_write</text><text x="1082.5" y="364.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">then a vertex buffer</text><rect x="1251" y="250" width="257" height="136" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1367.5,264) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></g><text x="1379.5" y="308" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">Render pass</text><text x="1379.5" y="329.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">draw(3, count) instanced</text><text x="1379.5" y="346.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">rotate to velocity</text><text x="1379.5" y="364.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">speed tint -&gt; canvas</text><path d="M617,315 L655,315" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M914,315 L952,315" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M1211,315 L1249,315" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M300,210 L770.0,210.0 Q785,210 785.0,225.0 L785,248" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><rect x="454.848" y="198.0" width="130.304" height="24.0" rx="12" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="520" y="214.44" text-anchor="middle" font-size="12" font-weight="600" fill="#8c5a0d">SimParams uniform</text><path d="M1082,382 L1082.0,419.0 Q1082,434 1067.0,434.0 L503.0,434.0 Q488,434 488.0,419.0 L488,382" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="629.16" y="422.0" width="141.67999999999998" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="700" y="438.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">swap A/B each frame</text><rect x="50" y="560" width="1460" height="200" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="551" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">INSIDE THE COMPUTE PASS · ONE THREAD PER BOID</text><rect x="74" y="594" width="320" height="140" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,609) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="120" y="625" font-size="16.5" font-weight="700" fill="#17509f">Cohesion</text><text x="91" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">steer to local center</text><text x="91" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">avg pos within r1</text><text x="91" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">* rule1Scale</text><rect x="434" y="594" width="320" height="140" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(450,609) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="480" y="625" font-size="16.5" font-weight="700" fill="#9e2b36">Separation</text><text x="451" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">push from close boids</text><text x="451" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sum of -(other - pos)</text><text x="451" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">* rule2Scale</text><rect x="794" y="594" width="320" height="140" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(810,609) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.6 6H14a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h.5"/></g><text x="840" y="625" font-size="16.5" font-weight="700" fill="#136b74">Alignment</text><text x="811" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">match neighbour heading</text><text x="811" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">avg vel within r3</text><text x="811" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">* rule3Scale</text><rect x="1154" y="594" width="336" height="140" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1170,609) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="1200" y="625" font-size="16.5" font-weight="700" fill="#8c5a0d">then integrate</text><text x="1171" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">+ optional pointer force</text><text x="1171" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">clamp to maxSpeed</text><text x="1171" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">step + wrap [-1, 1]</text><rect x="50" y="790" width="720" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="814" font-size="13.2" font-weight="700" fill="#8c5a0d">Brute force O(n²) - on purpose</text><text x="66" y="836" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Each boid reads the whole flock every frame. On a GPU that tight,</text><text x="66" y="854.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">branch-light loop is what a warp wants, so it beats bucketing at this</text><text x="66" y="872.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">scale. The slider caps at 8,000; a GPU uniform grid is the next step.</text><rect x="790" y="790" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="814" font-size="13.2" font-weight="700" fill="#186547">Same look, WebGL2 fallback</text><text x="806" y="836" font-size="12.4" fill="#186547" fill-opacity="0.92">No WebGPU, or a device lost mid-run, falls back to WebGL2 with the same</text><text x="806" y="854.4" font-size="12.4" fill="#186547" fill-opacity="0.92">boids math and shading. The sim moves to the CPU with a uniform spatial</text><text x="806" y="872.8" font-size="12.4" fill="#186547" fill-opacity="0.92">grid (O(n·k)), count capped; the panel always shows the live backend.</text><text x="780.0" y="922" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/gpu-flock</text></svg>